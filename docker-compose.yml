# Local development services: Postgres + MinIO (pgsty/silo fork, S3-compatible like Spaces).
# Ports are chosen to avoid clashing with a Postgres/MinIO already running on the machine.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: photographers
      POSTGRES_PASSWORD: photographers
      POSTGRES_DB: photographers
    ports: ['5433:5432']
    volumes: [dbdata:/var/lib/postgresql/data]

  s3:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ':9101'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['9100:9000', '9101:9101']
    volumes: [s3data:/data]

  s3-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on: [s3]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://s3:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/photos-public local/photos-private;
      mc anonymous set download local/photos-public;
      mc anonymous set none local/photos-private;
      "

volumes:
  dbdata:
  s3data:
